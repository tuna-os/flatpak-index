# Install in tuna-os/docs only, after completing docs/PUBLISHING.md's rollout.
# Vendor pull-index.py and update-index.py into .github/scripts/ together.
name: Refresh Flatpak index

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-flatpak-index
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'tuna-os/docs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write  # Dispatch the existing deployment after a bot-token push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install registry client
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Pull approved images
        run: |
          python3 .github/scripts/pull-index.py \
            --policy .github/flatpak-sources.json \
            --index-file static/flatpak/index/static
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add static/flatpak/index/static
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(flatpak): refresh approved OCI images'
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN pushes do not trigger push workflows. Always dispatch
          # so a failed dispatch is retried even when the next index is unchanged.
          gh workflow run deploy-flatpak.yml --repo tuna-os/docs --ref main
