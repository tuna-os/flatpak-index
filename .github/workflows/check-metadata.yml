name: Check remote metadata

# Verifies that every app published to the live remote still carries the
# AppStream metadata software centres need, and validates the live served catalog
# against repository descriptor and OCI index specifications.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch the served index
        run: curl -sSfL -o served-index.json https://tunaos.org/flatpak/index/static

      - name: Check production catalog coverage and advertised IDs
        run: |
          curl --fail --silent --show-error --location -o expected-apps.json https://tunaos.org/flatpak/expected-apps.json
          python3 scripts/catalog.py expected-apps.json --readme README.md --index served-index.json

      - name: Check AppStream metadata against the registry
        run: ./scripts/enrich-index.py served-index.json --check

      - name: Validate catalog structure and AppStream catalogue
        run: python3 -m unittest tests/test_index.py -v
        env:
          FLATPAK_INDEX_FILE: served-index.json
