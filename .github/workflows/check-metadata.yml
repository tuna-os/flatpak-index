name: Check remote metadata

# Verifies that every app published to the live remote still carries the
# AppStream metadata software centres need. This checks the served index, not
# this repository's historical snapshot, so it runs on a schedule rather than
# on push.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the served index
        run: curl -sSfL -o served-index.json https://tunaos.org/flatpak/index/static

      - name: Check AppStream metadata against the registry
        run: ./scripts/enrich-index.py served-index.json --check
      - name: Check freshness and installability against the registry
        # enrich-index.py above confirms the served index still carries the
        # metadata the registry has; this confirms the served index still points
        # at what the registry currently serves, so a newer publish that moved a
        # tag is caught as drift rather than silently lagging production.
        run: ./scripts/check-freshness.py served-index.json --check
