name: Check remote metadata

# Verifies that every app published to the live remote still carries the
# AppStream metadata software centres need, and validates the live served catalog
# against repository descriptor and OCI index specifications.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the served index
        run: curl -sSfL -o served-index.json https://tunaos.org/flatpak/index/static

      - name: Check production catalog coverage and advertised IDs
        run: |
          curl --fail --silent --show-error --location -o expected-apps.json https://tunaos.org/flatpak/expected-apps.json
          python3 scripts/catalog.py expected-apps.json --readme README.md --index served-index.json

      - name: Check AppStream metadata against the registry
        run: ./scripts/enrich-index.py served-index.json --check

      - name: Validate catalog structure and AppStream catalogue
        run: python3 -m unittest tests/test_index.py -v
        env:
          FLATPAK_INDEX_FILE: served-index.json

      - name: Open an issue when the check fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="check-metadata failing"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$existing" != "0" ]; then
            echo "An open '$title' issue already exists; not filing another."
            exit 0
          fi
          cat > issue-body.md <<EOF
          The scheduled check-metadata run failed: $RUN_URL

          This workflow validates the *served* index at https://tunaos.org/flatpak/, not this
          branch, so a failure can mean a deploy has not propagated. See
          docs/check-metadata-failure.md to read the run and route the failure.
          EOF
          sed -i 's/^          //' issue-body.md
          gh issue create --title "$title" --body-file issue-body.md
