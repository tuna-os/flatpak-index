name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check .
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python3 -m unittest discover -s tests -v

  publisher-action:
    name: publisher action conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Create OCI fixture
        run: |
          PYTHONPATH=tests python3 - <<'PYTEST'
          from pathlib import Path
          from test_update_index import APPSTREAM_LABELS, FLATPAK_LABELS, write_oci_layout
          write_oci_layout(Path('fixture.oci'), {**FLATPAK_LABELS, **APPSTREAM_LABELS})
          PYTEST
      - uses: ./.github/actions/update-flatpak-index
        with:
          oci-dir: fixture.oci
          index-file: candidate/index.json
          repo-name: tuna-os/example
          require-appstream: 'true'
          tags: latest stable
      - name: Verify published labels and tags
        run: |
          PYTHONPATH=tests python3 - <<'PYTEST'
          import json
          from pathlib import Path
          from test_update_index import APPSTREAM_LABELS, FLATPAK_LABELS
          index = json.loads(Path('candidate/index.json').read_text())
          assert index['Registry'] == 'https://ghcr.io'
          assert index['Results'][0]['Name'] == 'tuna-os/example'
          image = index['Results'][0]['Images'][0]
          assert image['Labels'] == {**FLATPAK_LABELS, **APPSTREAM_LABELS}
          assert image['Tags'] == ['latest', 'stable']
          PYTEST

  # The capture action is consumed by other repos, so a defect in it only ever
  # surfaces as a red build somewhere else. It shipped asking for
  # xorg-x11-utils (retired and split by Fedora years ago) and matching
  # windows only by _NET_WM_PID (which plain Xt apps never set), and nothing
  # here noticed, because nothing here ran it. These two jobs run it for real
  # on both package-manager paths.
  #
  # xclock -analog rather than xmessage: xmessage draws unantialiased black
  # text on white, i.e. exactly 2 colours, which the script's own
  # blank-image guard rejects. The clock's curves clear it comfortably (255
  # colours) while still being a trivial dependency.
  capture-action-apt:
    name: capture action (apt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the test client
        # xclock lives in x11-apps on Debian; the action installs x11-utils,
        # which is a different package.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq x11-apps
      - uses: ./.github/actions/capture-screenshots
        with:
          command: xclock -analog
          name: self-test
          out-dir: /tmp/shots
      - name: The capture must be a real, non-blank image
        run: |
          # capture-app.sh deletes a flat image rather than leaving it on
          # disk, so a file existing here means a window genuinely painted.
          test -s /tmp/shots/self-test.png
          identify -format '%m %wx%h %k colours\n' /tmp/shots/self-test.png | grep -q '^PNG'

  capture-action-dnf:
    name: capture action (dnf)
    runs-on: ubuntu-latest
    container: fedora:46
    steps:
      - name: Install git first
        run: dnf -y install git
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the test client
        run: dnf -y install xclock
      - uses: ./.github/actions/capture-screenshots
        with:
          command: xclock -analog
          name: self-test
          out-dir: /tmp/shots
      - name: The capture must be a real, non-blank image
        run: |
          test -s /tmp/shots/self-test.png
          identify -format '%m %wx%h %k colours\n' /tmp/shots/self-test.png | grep -q '^PNG'
